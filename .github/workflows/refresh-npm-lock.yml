name: Refresh npm lock

on:
  push:
    branches:
      - fix/audit-stabilization

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v5
        with:
          ref: fix/audit-stabilization

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh npm lockfile"
          git push origin HEAD:fix/audit-stabilization
