name: Refresh npm lock

on:
  push:
    branches:
      - fix/audit-stabilization
    paths:
      - package.json

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Capture audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload resolved lock and audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-lock-refresh
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 1
