name: Refresh npm lock

on:
  push:
    branches:
      - fix/audit-stabilization
    paths:
      - package.json
      - .github/workflows/refresh-npm-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: fix/audit-stabilization

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report=require('./npm-audit.json'); if(report.metadata.vulnerabilities.total) { console.error(report.metadata.vulnerabilities); process.exit(1) }"

      - name: Commit resolved lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile"
          git push origin HEAD:fix/audit-stabilization
