name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leadergrl/portfolio

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install asset pipeline dependencies
        run: python -m pip install pillow numpy scipy

      - name: Install dependencies
        run: npm ci

      - name: Audit repository assets
        run: npm run audit:assets

      - name: Upload asset audit
        uses: actions/upload-artifact@v7
        with:
          name: asset-audit
          path: tmp/asset-audit.json
          retention-days: 14

      - name: Restore generated asset cache
        id: generated-assets-cache
        uses: actions/cache@v6
        with:
          path: assets/build
          key: >-
            generated-assets-${{ runner.os }}-
            ${{ hashFiles('assets/src/**', 'tools/assets.mjs', 'tools/build_*.py') }}

      - name: Generate assets
        if: steps.generated-assets-cache.outputs.cache-hit != 'true'
        run: npm run assets

      - name: Build production bundle
        run: npm run build

      - name: Validate generated Nginx config
        run: >-
          docker run --rm
          -v "$PWD/dist/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/dist:/usr/share/nginx/html:ro"
          nginx:1.30.4-alpine nginx -t

      - name: Run runtime tests
        run: npm run test:runtime

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist/
          retention-days: 1

  browser-tests:
    name: Browser tests (${{ matrix.project }})
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Download production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist/

      # Each browser project gets its own runner. This keeps software-GL tests
      # isolated while reducing wall-clock CI time from one long serial suite.
      - name: Run browser tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-image:
    name: Publish production image
    needs:
      - build-and-test
      - browser-tests

    # Only publish production after a successful push to master.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
