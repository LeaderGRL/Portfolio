services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: portfolio

    restart: unless-stopped

    networks:
      - public-web

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/health

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  public-web:
    external: true
