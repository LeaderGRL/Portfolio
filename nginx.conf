# Build-time SEO maps are injected above the server block. Keeping the markers
# in this source file means the config remains valid on its own while production
# receives route-specific metadata generated from content Markdown.
# SEO_MAPS_GENERATED_HERE

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Serve the portfolio. Production replaces the SEO marker below with
    # sub_filter directives keyed by $uri before this file reaches Nginx.
    location / {
# SEO_SUB_FILTERS_GENERATED_HERE
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for Docker and future monitoring
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
